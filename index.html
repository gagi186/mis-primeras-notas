      info.append(name, meta);

      const open = document.createElement('button');
      open.textContent = 'Abrir';
      open.addEventListener('click', () => openSong(song));
      const exp = document.createElement('button');
      exp.textContent = 'Exportar';
      exp.addEventListener('click', () => exportSongs([song], song.name));
      const del = document.createElement('button');
      del.textContent = 'Borrar';
      del.className = 'danger';
      del.addEventListener('click', () => {
        if (!confirm(`¿Borrar "${song.name}"?`)) return;
        writeStore(SONGS_KEY, readSongs().filter(s => s.id !== song.id));
        listSongs();
      });
      li.append(info, open, exp, del);
      songListEl.appendChild(li);
    }
  }

  // Guardar: si ya existe una canción con ese nombre en este nivel, se actualiza
  function saveSong() {
    const name = songNameEl.value.trim();
    if (!name) { songNameEl.focus(); return; }
    if (!notes().length) { message('No hay notas que guardar', true); return; }
    const songs = readSongs();
    const existing = songs.find(s => s.name.toLowerCase() === name.toLowerCase() && s.level === level);
    const data = { name, level, tempo: LEVELS[level].tempo, notes: pack(notes()), updated: Date.now() };
    if (hasBars(level)) data.meter = LEVELS[level].meter;
    if (hasKeys(level)) data.key = LEVELS[level].key;
    if (existing) Object.assign(existing, data);
    else songs.push({ id: Date.now().toString(36), ...data });
    if (!writeStore(SONGS_KEY, songs)) { message('No se pudo guardar en este dispositivo', true); return; }
    LEVELS[level].name = name;
    saveCurrent();
    message(existing ? `"${name}" actualizada ✓` : `"${name}" guardada ✓`);
    songNameEl.blur();
    listSongs();
    showBackupState();
  }

  function openSong(song) {
    const L = LEVELS[song.level];
    L.notes.length = 0;
    L.notes.push(...unpack(song.notes));
    L.history.length = 0;
    L.redo.length = 0;
    L.name = song.name;
    L.tempo = validTempo(song.tempo);
    if (hasBars(song.level)) L.meter = validMeter(song.meter);
    if (hasKeys(song.level)) L.key = validKey(song.key);
    saveCurrent();
    closeSongs();
    setLevel(song.level);
    page = 0;
    scrollX = scrollTarget = 0;
    render();
  }

  // --- Exportar e importar (archivo .json para pasar entre tablets) ---
  const FILE_APP = 'pentagrama';

  const songForFile = ({ name, level, tempo, meter, key, notes }) => ({
    name, level, tempo: validTempo(tempo), notes,
    ...(hasBars(level) ? { meter: validMeter(meter) } : {}),
    ...(hasKeys(level) ? { key: validKey(key) } : {}),
  });

  // Entrega un archivo: con HTTPS, el menú de compartir del iPad/Android
  // (Guardar en Archivos, iCloud Drive, Google Drive, AirDrop…); si no, se descarga.
  // Devuelve 'shared', 'downloaded' o 'cancelled'.
  async function deliverFile(data, fileName, title) {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const file = new File([blob], fileName, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title });
        return 'shared';
      } catch (e) {
        if (e.name === 'AbortError') return 'cancelled';
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return 'downloaded';
  }

  async function exportSongs(songs, title) {
    if (!songs.length) { message('No hay canciones que exportar', true); return; }
    const safe = title.replace(/[\\/:*?"<>|]+/g, '').trim() || 'canciones';
    const fileName = `${safe}.pentagrama.json`;
    const how = await deliverFile({ app: FILE_APP, version: 1, songs: songs.map(songForFile) }, fileName, title);
    if (how === 'downloaded') message(`Exportado: ${fileName}`);
  }

  // --- Copia de seguridad: todas las canciones y lo que hay en cada nivel ---
  const BACKUP_KEY = 'pentagrama.ultimaCopia';
  const DAY = 24 * 60 * 60 * 1000;
  const lastBackup = () => readStore(BACKUP_KEY, 0);

  // Conviene hacer copia si hay canciones guardadas después de la última copia
  // y esa copia tiene más de una semana (o nunca se hizo)
  function needsBackup() {
    const songs = readSongs();
    if (!songs.length) return false;
    const newest = Math.max(...songs.map(s => s.updated || 0));
    return newest > lastBackup() && Date.now() - lastBackup() > 7 * DAY;
  }

  function showBackupState() {
    const last = lastBackup();
    const el = document.getElementById('backupInfo');
    const days = Math.floor((Date.now() - last) / DAY);
    el.textContent = !last ? 'Todavía no has hecho ninguna copia de seguridad.'
      : `Última copia: ${days === 0 ? 'hoy' : days === 1 ? 'ayer' : `hace ${days} días`}.`;
    el.classList.toggle('late', needsBackup());
    document.getElementById('songsBtn').classList.toggle('remind', needsBackup());
  }

  async function backupAll() {
    const songs = readSongs();
    const current = readStore(CURRENT_KEY, null);
    if (!songs.length && !LEVEL_IDS.some(n => LEVELS[n].notes.length)) {
      message('Todavía no hay nada que guardar', true);
      return;
    }
    saveCurrent();
    const today = new Date().toISOString().slice(0, 10);
    const data = {
      app: FILE_APP, version: 1, kind: 'backup', date: today,
      songs: songs.map(songForFile),
      current: readStore(CURRENT_KEY, current),
    };
    const how = await deliverFile(data, `Mis primeras notas - copia ${today}.json`, 'Copia de seguridad');
    if (how === 'cancelled') return;
    writeStore(BACKUP_KEY, Date.now());
    message(how === 'shared' ? 'Copia de seguridad hecha ✓'
      : 'Copia de seguridad descargada ✓ (guárdala en iCloud Drive o Google Drive)');
    showBackupState();
  }

  // Al recuperar una copia: volver a poner lo que había en el pentagrama de cada nivel
  function restoreCurrent(current) {
    for (const n of LEVEL_IDS) {
      const c = current?.[n];
      if (!c) continue;
      const L = LEVELS[n];
      L.notes.length = 0;
      L.notes.push(...unpack(Array.isArray(c.notes) ? c.notes.filter(x => x && (x.r || Number.isInteger(x.p))) : []));
      L.history.length = 0;
      L.redo.length = 0;
      L.name = typeof c.name === 'string' ? c.name.slice(0, 60) : '';
      if (c.tempo) L.tempo = validTempo(c.tempo);
      if (hasBars(n) && c.meter) L.meter = validMeter(c.meter);
      if (hasKeys(n) && c.key !== undefined) L.key = validKey(c.key);
    }
    saveCurrent();
    relayout();
  }

  // Valida una canción leída de un archivo
  function cleanSong(x) {
    if (!x || typeof x.name !== 'string' || !LEVEL_IDS.includes(x.level) || !Array.isArray(x.notes)) return null;
    const f = n => x.level === 1 ? NOTE_FIG.name : figByName(n.f).name;
    const notes = x.notes
      .filter(n => (hasBars(x.level) && n?.r) || (Number.isInteger(n?.p) && n.p >= P_MIN && n.p <= P_MAX))
      .map(n => n.r && hasBars(x.level) ? { r: 1, f: f(n) }
        : { p: n.p, f: f(n), ...(hasAccs(x.level) && [1, -1].includes(n.a) || hasKeys(x.level) && n.a === 0 ? { a: n.a } : {}) });
    const name = x.name.trim().slice(0, 60);
    if (!name || !notes.length) return null;
    const song = { name, level: x.level, tempo: validTempo(x.tempo), notes };
    if (hasBars(x.level)) song.meter = validMeter(x.meter);
    if (hasKeys(x.level)) song.key = validKey(x.key);
    return song;
  }

  async function importFile(file) {
    let data;
    try { data = JSON.parse(await file.text()); }
    catch (_) { message('Ese archivo no es una canción válida', true); return; }
    const incoming = (data?.app === FILE_APP && Array.isArray(data.songs) ? data.songs : [])
      .map(cleanSong).filter(Boolean);
    const isBackup = data?.app === FILE_APP && data.kind === 'backup';
    if (!incoming.length && !isBackup) { message('Ese archivo no contiene canciones', true); return; }
    // Copia de seguridad: ¿recuperar también lo que había en el pentagrama?
    if (isBackup && data.current && confirm(
      `Copia de seguridad del ${data.date || ''}.\n\n¿Recuperar también lo que había escrito en el pentagrama de cada nivel? ` +
      'Se reemplaza lo que tienes ahora en el pentagrama (tus canciones guardadas no se borran).'))
      restoreCurrent(data.current);

    const songs = readSongs();
    let added = 0, same = 0;
    for (const song of incoming) {
      const sameName = s => s.level === song.level && s.name.toLowerCase() === song.name.toLowerCase();
      const twin = songs.find(sameName);
      if (twin && JSON.stringify(twin.notes) === JSON.stringify(song.notes)) {
        twin.tempo = song.tempo;
        same++;
        continue;
      }
      // Si ya hay otra con ese nombre, la importada se renombra
      let name = song.name, k = 2;
      while (songs.some(s => s.level === song.level && s.name.toLowerCase() === name.toLowerCase()))
        name = `${song.name} (${k++})`;
      songs.push({ id: Date.now().toString(36) + added, ...song, name, updated: Date.now() });
      added++;
    }
    if (!writeStore(SONGS_KEY, songs)) { message('No se pudo guardar en este dispositivo', true); return; }
    const parts = [];
    if (added) parts.push(added === 1 ? '1 canción importada ✓' : `${added} canciones importadas ✓`);
    if (same) parts.push(same === 1 ? '1 ya estaba' : `${same} ya estaban`);
    if (isBackup) parts.unshift('Copia recuperada ✓');
    message(parts.join(' · '));
    listSongs();
    showBackupState();
  }

  const importInput = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', () => {
    const file = importInput.files[0];
    importInput.value = '';
    if (file) importFile(file);
  });
  document.getElementById('backupBtn').addEventListener('click', backupAll);

  document.getElementById('songsBtn').addEventListener('click', openSongs);
  document.getElementById('closeSongs').addEventListener('click', () => closeSongs());
  document.getElementById('saveSong').addEventListener('click', saveSong);
  songNameEl.addEventListener('keydown', e => { if (e.key === 'Enter') saveSong(); });
  songsEl.addEventListener('pointerdown', e => { if (e.target === songsEl) closeSongs(); });

  const pager = document.getElementById('pager');
  const pageLabel = document.getElementById('pageLabel');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  // En Hoja cambian de página; en Zoom deslizan el pentagrama
  function move(dir) {
    if (view === 'zoom') scrollTarget += dir * viewW() * 0.6;
    else page += dir;
    render();
  }
  prevBtn.addEventListener('click', () => move(-1));
  nextBtn.addEventListener('click', () => move(1));

  // Mostrar el final de la melodía
  function showEnd() {
    const { pos, lastLine } = flow(notes());
    page = pageOf(lastLine);
    scrollX = scrollTarget = view === 'zoom' ? maxScrollFor(pos) : 0;
    scrollV = 0;
  }

  const levelBtns = document.querySelectorAll('#levels button');
  function setLevel(n) {
    stop();
    level = n;
    levelBtns.forEach(b => b.classList.toggle('on', +b.dataset.level === n));
    // En el nivel 7 lo normal es seguir la armadura; fuera de él esa opción no existe
    if (hasKeys(n) && accSel === 0) setAcc('key');
    if (!hasKeys(n) && accSel === 'key') setAcc(0);
    showTempo();
    relayout();
  }
  levelBtns.forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.level)));

  const viewBtns = document.querySelectorAll('#views button');
  function setView(v) {
    view = v;
    document.body.classList.toggle('zoom', v === 'zoom');
    viewBtns.forEach(b => b.classList.toggle('on', b.dataset.view === v));
    relayout();
  }
  viewBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

  // Borde derecho real de la clave de sol (depende de la fuente del dispositivo)
  // Borde derecho de la clave de sol
  function measureClef() {
    return G.left + G.gap * 0.3 + CLEF.width * G.gap / CLEF.unitsPerGap;
  }

  function relayout() {
    G = computeGeometry();
    G.clefRight = measureClef();
    // Desde el nivel 3: el compás va justo después de la clave
    // Clave, después armadura (nivel 7) y después compás
    G.keyX = G.clefRight + G.gap * 0.2;
    const sigs = hasKeys(level) ? KEYS[LEVELS[level].key].sig.length : 0;
    G.tsX = G.keyX + (sigs ? sigs * G.gap * 0.85 + G.gap * 0.3 : 0);
    G.headerRight = hasBars(level) ? G.tsX + G.gap * 1.6 : G.clefRight;
    // En Zoom las notas empiezan justo después de la cabecera
    if (view === 'zoom') G.firstX = G.headerRight + G.gap * 0.8;
    else G.firstX = Math.max(G.firstX, G.headerRight + G.gap * 0.8);
    showEnd();
    render();
  }
  level = 1;
  levelBtns.forEach(b => b.classList.toggle('on', +b.dataset.level === 1));
  setMode('note');
  setAcc(0);
  setDot(false);
  setSix(false);
  setView('sheet');
  showTempo();
  // Al abrir, mostrar la melodía desde el principio
  page = 0;
  scrollX = scrollTarget = 0;
  render();
  window.addEventListener('resize', relayout);

  // Instalar en la pantalla de inicio: Android/Chrome ofrece su propio aviso;
  // en iPad hay que hacerlo desde Compartir
  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const installRow = document.getElementById('installRow');
  const installBtn = document.getElementById('installBtn');
  const installHint = document.getElementById('installHint');
  let installPrompt = null;
  if (!installed && /iPad|iPhone|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
    installRow.hidden = false;
    installBtn.hidden = true;
    installHint.textContent = 'Para instalarla: Compartir → Agregar a pantalla de inicio.';
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installPrompt = e;
    installRow.hidden = false;
    installBtn.hidden = false;
    installHint.textContent = 'Funciona sin conexión y se abre a pantalla completa.';
  });
  installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    installRow.hidden = true;
  });
  window.addEventListener('appinstalled', () => { installRow.hidden = true; });

  // Pantalla completa (Android y iPad en el navegador; instalada ya lo es)
  const fullBtn = document.getElementById('fullBtn');
  const root = document.documentElement;
  const canFull = !installed && !!(root.requestFullscreen || root.webkitRequestFullscreen);
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  fullBtn.hidden = !canFull;
  fullBtn.addEventListener('click', async () => {
    try {
      if (isFull()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else await (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    } catch (_) {
      flash('Este navegador no permite pantalla completa aquí. Instálala en la pantalla de inicio (📁)');
    }
  });
  const onFull = () => {
    fullBtn.classList.toggle('on', isFull());
    fullBtn.setAttribute('aria-label', isFull() ? 'Salir de pantalla completa' : 'Pantalla completa');
  };
  document.addEventListener('fullscreenchange', onFull);
  document.addEventListener('webkitfullscreenchange', onFull);

  // Aviso de copia de seguridad al abrir la app
  showBackupState();
  if (needsBackup()) setTimeout(() => {
    clearTimeout(tipTimer);
    setTip('💾 Hace tiempo que no haces copia de seguridad de tus canciones (en 📁)');
    tipTimer = setTimeout(() => setTip(null), 6000);
  }, 1200);

  // Funcionar sin conexión (solo en HTTPS o en localhost)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
